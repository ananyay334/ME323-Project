# =============================================================================
# ME 323 - 304 stainless steel, dry reciprocating: ML configuration, TRACK-WIDTH variant.
# Same as default.yaml except the wear target: log10 of the wear-track width (smooth band
# width from the profilometer scans, all locations), which is far more repeatable on these
# rough plates than the groove volume (replicate SD 0.07 vs 0.36 dex).
#   python -m ml.train --config ml/configs/width.yaml [--final]
#
#   python -m ml.train  [--data synthetic|real] [--quick]       # CV on the training runs
#   python -m ml.train  --final [--force]                       # + refit, test set scored once
#   python -m ml.topup  --n 4                                   # next runs: GPR sigma + ANN spread
#
# Paths are relative to the project root. `--quick` deep-merges the `quick:` block (bottom)
# over everything else. The resolved config is saved with every result folder.
# =============================================================================
seed: 323
n_jobs: -1                        # parallel CV tasks (joblib/loky); -1 = all cores

# --------------------------------------------------------------------- data
data:
  source: real                    # used when --data is not given
  real:
    checkpoints: data/processed/runs_checkpoints.csv
    cof_cycles: data/processed/cof_cycles.csv
    topup_candidates: data/topup_candidates.csv
  synthetic:
    checkpoints: data/synthetic/runs_checkpoints.csv
    cof_cycles: data/synthetic/cof_cycles.csv
    topup_candidates: data/synthetic/topup_candidates.csv
  run_sheet: data/run_sheet.csv   # used positions / existing runs for top-up selection
  drop_status: [error]
  train_roles: [completed, corner, interior, center_replicate, topup]   # R00-R23 + top-ups
  test_roles: [test]                                                    # R24-R29, --final only
  replicates: [R04, R14, R20]     # centre replicates: noise floor

# Inputs (nominal, natural log; standardised inside the folds): ln L, ln f, ln t_ckpt.
targets: [log10_w, COF_steady]

# Wear_detected == False -> wear below the detection limit (censored), not zero.
censoring:
  mode: exclude                   # exclude | lod_half  (log10 k only)

# --------------------------------------------------------------------- CV
cv:
  n_splits: 5                     # GroupKFold by run group, groups shuffled by seed
  seeds: [0, 1, 2, 3, 4]          # one outer repeat per seed
  inner_folds: 4                  # nested tuning: GroupKFold on the training groups

# --------------------------------------------------------------------- models
# params: fixed constructor arguments. grid: lists searched exhaustively in the inner CV.
models:
  ann:                            # 3 -> {3, 4} tanh -> 2 outputs (log10 k, COF), <= 30 weights
    enabled: true
    params: {n_members: 20, lr: 0.01, max_epochs: 3000, patience: 200, val_frac: 0.2}
    grid:
      hidden: [3, 4]
      weight_decay: [0.0001, 0.001, 0.01]
  gpr:                            # Constant * Matern-5/2 (ARD) + White, normalize_y, 5 restarts
    enabled: true
    params: {n_restarts_optimizer: 5, nu: 2.5}
  svr:
    enabled: true
    grid:
      C: [0.1, 1, 10, 100]
      gamma: [scale, 0.1, 1]
      epsilon: [0.01, 0.05, 0.1]
  tabpfn:
    enabled: true
  xgb:                            # shallow
    enabled: true
    params: {subsample: 0.8}
    grid:
      max_depth: [1, 2]
      n_estimators: [200, 400]
      learning_rate: [0.03, 0.05]
      min_child_weight: [2, 4]
  ridge:                          # reference only, never selected; exponents with bootstrap CIs
    enabled: true
    grid:
      alpha: [0.1, 1, 10]

# --------------------------------------------------------------------- interpretation / report
interpret:
  enabled: true
  map_points: 41                  # GPR surface grid per axis
  surface_times_s: [60, 120]      # GPR surfaces over ln L x ln f at these checkpoint times
  permutation_repeats: 10         # group-permutation importance (first outer repeat)
  bootstrap: 1000                 # group-bootstrap resamples for the Ridge exponents

# --------------------------------------------------------------------- final test
final:
  dir: final_width                # ml/results/final_width/ (synthetic: final_synthetic/); never overwritten without --force

# --------------------------------------------------------------------- top-up selection
topup:
  max_runs: 10                    # at most 10 top-up runs in total
  grid: {L: [10, 100, 15], f: [4, 15, 12], t: [60, 120, 7]}   # [min, max, points], log-spaced
  min_lft: 7200                   # L*f*t >= 7200
  max_lft: 90000                  # L*f*t <= 90000
  min_distance: 0.15              # standardised log space, to existing runs and earlier picks
  faces: [F1, F2]
  x_mm: [8, 21, 34]
  y_mm: [3, 6, 9, 12, 15, 18, 21, 24, 27, 30, 33, 36, 39]

# --------------------------------------------------------------------- --quick
# One outer repeat, inner 3 folds, first value of each grid list, ANN ensemble of 3.
quick:
  cv: {seeds: [0], inner_folds: 3}
  grid_first_only: true
  models: {ann: {params: {n_members: 3}}}
  interpret: {map_points: 21}
