# =============================================================================
# ME 323 triboinformatics - ML framework configuration (40-run DOE).
#
#   python -m ml.train --config ml/configs/default.yaml [--data synthetic|real] [--quick]
#
# Paths are relative to the project root. `--quick` deep-merges the `quick:` block
# (bottom of this file) over everything else. The resolved config is saved with
# every result folder (config_snapshot.yaml).
# =============================================================================
seed: 323
n_jobs: -1                        # parallel CV tasks (joblib/loky); -1 = all cores

# --------------------------------------------------------------------- data
data:
  source: real                    # used when --data is not given
  real:
    runs: data/processed/runs_targets.csv
    timeseries: data/processed/cof_timeseries.csv
    wear_trajectory: data/processed/wear_trajectory.csv
  synthetic:
    runs: data/synthetic/runs_targets.csv
    timeseries: data/synthetic/cof_timeseries.csv
    wear_trajectory: data/synthetic/wear_trajectory.csv
  drop_status: [error]
  drop_id_prefixes: [TRIAL]
  # Rows missing any of these cannot be placed in the design space -> dropped (logged).
  design_columns: [Carbon_pct, Load_N, Freq_Hz]
  # Candidate input columns; absent / all-NaN ones are dropped and logged.
  input_columns: [Carbon_pct, Hardness_HV, Load_N, Freq_Hz, Stroke_mm, Speed_mps,
                  Hertz_p_mean_MPa, Hertz_width_um]
  cof_bin_s: 120                  # cof_time regime: mean COF per bin (Time_s = bin end)
  # Centre-point replicate pairs: pooled SD = noise floor of every endpoint target.
  replicate_pairs: [[R03, R04], [R13, R14], [R23, R24], [R33, R34]]

# Wear_detected == False -> wear below the detection limit (censored), not zero.
censoring:
  mode: exclude                   # exclude | lod_half

# Regimes -> targets. `--targets` takes regime names or target names.
regimes:
  endpoint: [log10_k, log10_V, COF_ss_mean]
  trajectory_params: [log10_Vdot_steady, log10_dV_run, log10_tau_trans]
  wear_checkpoints: [log10_V_t]   # extra input log10(Time_s); rows with t > 0
  cof_time: [COF_t]               # extra input Time_s (bin end)

# --------------------------------------------------------------------- features
features:
  sets:
    base: [Carbon_pct, Load_N, Freq_Hz]
    physics: [Carbon_pct, Load_N, Freq_Hz, Speed_mps, Hertz_p_mean_MPa, PV]
  optional_base: [Hardness_HV]    # added to every set when it has any non-null value
  use: [base, physics]

# --------------------------------------------------------------------- CV
cv:
  gkf5:
    n_splits: 5                   # 8 runs per fold (asserted; next seed offset on violation)
    seeds: [0, 1, 2, 3, 4]        # one repeat per seed
    stratify: Specimen_ID
    seed_offset_step: 1000
    max_tries: 500
  loao: true                      # leave one alloy (specimen) out: 4 folds
  inner_folds: 4                  # nested tuning: GroupKFold on the training groups
  heavy_task_slots: 3             # GPR fits on > 400 rows (cof_time) run at most 3 at a time

# --------------------------------------------------------------------- models
# params: fixed constructor arguments. grid: lists searched exhaustively in the inner CV.
models:
  gpr:
    enabled: true
    params: {n_restarts_optimizer: 5, nu: 2.5}
  tabpfn:
    enabled: true
  svr:
    enabled: true
    grid:
      C: [0.1, 1, 10, 100]
      gamma: [scale, 0.01, 0.1, 1]
      epsilon: [0.01, 0.05, 0.1]
  rf:
    enabled: true
    params: {n_estimators: 300}
    grid:
      max_depth: [2, 3]
      min_samples_leaf: [3, 5]
      max_features: [1.0, sqrt]
  xgb:
    enabled: true
    params: {subsample: 0.8, reg_lambda: 1.0}
    grid:
      n_estimators: [200, 500]
      max_depth: [2, 3]
      learning_rate: [0.02, 0.05]
      min_child_weight: [3, 5]
  ridge:                          # reference baseline only, never selected
    enabled: true
    grid:
      alpha: [0.1, 1, 10]

# --------------------------------------------------------------------- physics route (B5)
physics_route:
  enabled: true                   # eq.-1 parameters -> two_stage_wear -> wear_checkpoints rows

# --------------------------------------------------------------------- interpretation
interpret:
  enabled: true
  map_points: 41                  # GPR response surface grid per axis
  calibration_levels: 19

# --------------------------------------------------------------------- --quick
# One gkf5 repeat, inner 3 folds, first value of each grid list only.
quick:
  cv: {gkf5: {seeds: [0]}, inner_folds: 3}
  grid_first_only: true
  interpret: {map_points: 21}
